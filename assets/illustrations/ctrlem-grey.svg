<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#8A8A8A" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="none" stroke="#8A8A8A" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- CtrlEm container -->
    <path d="M 205 185
             L 205 140
             Q 205 125 220 125
             L 420 125
             Q 435 125 435 140
             L 435 185" />

    <!-- loop arrow around CtrlEm -->
    <path d="M 455 175
             C 500 205, 495 265, 430 292
             C 355 324, 250 315, 190 275
             C 165 258, 155 235, 160 215"
          marker-end="url(#arrow)" />

    <!-- down arrow -->
    <path d="M 320 365 L 320 445" marker-end="url(#arrow)" />
  </g>

  <g fill="#8A8A8A"
     font-family="Inter, Segoe UI, Arial, sans-serif"
     text-anchor="middle">
    <text x="320" y="188" font-size="48" font-weight="400">CtrlEm</text>
    <text x="320" y="350" font-size="28" font-weight="400">20 files max</text>
    <text x="320" y="510" font-size="34" font-weight="400">Send</text>
  </g>
</svg>
